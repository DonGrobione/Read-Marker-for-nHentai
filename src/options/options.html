<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Marker for nHentai – List of Viewed Gallery IDs</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>List of viewed gallery IDs</h1>

    <textarea id="list" spellcheck="false" autocomplete="off" aria-label="Gallery IDs, one per line"></textarea>
    <p id="count" class="count">0 galleries saved.</p>

    <p class="hint">One gallery ID per line, only numbers without leading zeros. Click "Save" to apply your changes.</p>

    <div class="row">
      <button id="save" type="button" class="primary">Save changes</button>
      <button id="revert" type="button">Discard changes</button>
      <button id="export" type="button">Backup Export</button>
      <button id="import" type="button">Backup Import</button>
      <input id="import-file" type="file" accept=".json,.txt,application/json,text/plain" hidden>
    </div>

    <div id="import-confirm" class="confirm" hidden>
      <p id="import-summary"></p>
      <div class="row">
        <button id="import-apply" type="button" class="danger">Overwrite current list</button>
        <button id="import-cancel" type="button">Cancel</button>
      </div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <br>
    <p class="feedback">Found a problem or have an idea for an improvement? Please report it on <a href="https://github.com/DonGrobione/Read-Marker-for-nHentai/issues" target="_blank" rel="noopener noreferrer">GitHub Issues</a>.</p>
  </main>
  <script src="../storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
