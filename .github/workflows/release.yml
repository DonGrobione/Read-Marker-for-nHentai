# Creates a GitHub release with the packaged .xpi whenever the version in
# src/manifest.json changes on main (that is, when no tag v<version> exists yet).
name: Release

on:
  push:
    branches: [main]
    paths:
      - src/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src/manifest.json", encoding="utf-8"))["version"])')
          package_version=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error file=src/manifest.json::Unexpected version '$version'"
            exit 1
          fi
          if [ "$version" != "$package_version" ]; then
            echo "::error file=package.json::package.json version $package_version does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.exists.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Lint
        if: steps.exists.outputs.exists == 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run lint -- --warnings-as-errors

      - name: Build
        if: steps.exists.outputs.exists == 'false'
        run: python3 build.py

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Release notes: the CHANGELOG.md section for this version.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning file=CHANGELOG.md::No changelog section for $VERSION"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          cat >> notes.md <<'EOF'

          ---

          The attached `.xpi` is not signed by Mozilla. Firefox loads it only as a temporary add-on (`about:debugging#/runtime/this-firefox` → **Load Temporary Add-on…**), which is removed when Firefox restarts.
          EOF

          gh release create "$TAG" "dist/read-marker-for-nhentai-$VERSION.xpi" \
            --target "$GITHUB_SHA" \
            --title "Read Marker for nHentai $VERSION" \
            --notes-file notes.md
